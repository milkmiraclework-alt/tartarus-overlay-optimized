name: Standalone Windows overlay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build installer and portable executable
        shell: powershell
        run: ./tools/build-standalone.ps1
      - name: Verify bundled assets and exact reader kernels
        run: |
          node tools/bundled-site-check.js
          node tools/scan-kernel-check.js
      - uses: actions/upload-artifact@v4
        with:
          name: Tartarus-Optimized-Windows-x64
          path: |
            desktop/dist/Tartarus-Optimized-*-x64.exe
            desktop/dist/SHA256SUMS.txt
            desktop/dist/standalone-build.json
          if-no-files-found: error
